<div class="topbar">
  <div class="topbar-left">
    <button mat-icon-button (click)="toggleSidebar.emit()" matTooltip="Toggle Sidebar" class="menu-btn">
      <mat-icon>menu</mat-icon>
    </button>
    <h2 class="page-title">{{ pageTitle() }}</h2>
  </div>
  <div class="topbar-right">
    <button mat-stroked-button class="docs-btn api-btn" (click)="openApiDocs()" matTooltip="View REST API Documentation">
      <mat-icon>api</mat-icon>
      <span>API Docs</span>
    </button>
    <button mat-stroked-button class="docs-btn mcp-btn" (click)="openMcpDocs()" matTooltip="View MCP Server Integration Guide">
      <mat-icon>hub</mat-icon>
      <span>MCP Docs</span>
    </button>
    <div class="workspace-chip" *ngIf="workspace()">
      <mat-icon>work_outline</mat-icon>
      <span>{{ workspace() }}</span>
    </div>
    <button mat-icon-button routerLink="/settings" matTooltip="Settings">
      <mat-icon>settings</mat-icon>
    </button>
  </div>
</div>
