<div class="page-container fade-in-up">
  <div class="page-header">
    <h1>Base64 to Image Viewer</h1>
    <p>Paste base64 encoded strings to instantly preview as an image</p>
  </div>

  <div class="viewer-grid">
    <!-- Left Pane: Input -->
    <div class="section-card flex-col gap-4">
      <div class="section-title justify-between">
        <span><mat-icon>code</mat-icon> Base64 String</span>
        <div class="actions flex gap-2">
          <button mat-icon-button matTooltip="Clear All" (click)="clear()">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>
      </div>

      <mat-form-field appearance="outline" class="w-full textarea-field" style="flex: 1;">
        <textarea matInput rows="20" [(ngModel)]="base64Input" (ngModelChange)="onInputChange($event)" (paste)="onPaste($event)" placeholder='Paste your base64 string here e.g. "iVBOR..." (Quotes will be stripped)'></textarea>
      </mat-form-field>

      <div *ngIf="errorMsg()" class="gap-item error fade-in-up">
        <mat-icon>error_outline</mat-icon>
        <div class="flex-col">
          <span class="gap-text">Invalid Image</span>
          <span class="gap-sub">{{ errorMsg() }}</span>
        </div>
      </div>
    </div>

    <!-- Right Pane: Image Viewer -->
    <div class="section-card display-pane flex-col flex-1">
      <div class="section-title justify-between">
        <span><mat-icon>image</mat-icon> Image Preview</span>
        <div class="flex items-center gap-4">
           <button mat-icon-button matTooltip="Full Screen" (click)="toggleFullScreen()" [disabled]="!imageSrc()">
             <mat-icon>fullscreen</mat-icon>
           </button>
        </div>
      </div>

      <div class="image-container">
        <img *ngIf="imageSrc()" #previewImg [src]="imageSrc()" alt="Decoded representation" class="decoded-img" />
        <div *ngIf="!imageSrc()" class="empty-state">
          <mat-icon>image_not_supported</mat-icon>
          <p>Image will appear here</p>
        </div>
      </div>
    </div>
  </div>
</div>
