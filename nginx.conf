events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 4201;
        server_name localhost;

        root /var/www/html;
        index index.html;

        # Angular routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Python FastAPI proxy
        location /python-ai {
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Rewrite path to strip /python-ai prefix
            rewrite ^/python-ai/(.*)$ /$1 break;
            rewrite ^/python-ai$ / break;
        }

        # Jira Proxy
        location /jira-api {
            proxy_pass https://cloudsolutions-sa.atlassian.net;
            proxy_set_header Host cloudsolutions-sa.atlassian.net;
            proxy_ssl_server_name on;
            rewrite ^/jira-api/(.*)$ /$1 break;
            rewrite ^/jira-api$ / break;
        }

        # Bitbucket Proxy
        location /bitbucket-api {
            proxy_pass http://10.201.206.52:7990;
            proxy_set_header Host $host;
            rewrite ^/bitbucket-api/(.*)$ /$1 break;
            rewrite ^/bitbucket-api$ / break;
        }

        # Binance Proxy
        location /binance-api {
            proxy_pass https://api.binance.com;
            proxy_set_header Host api.binance.com;
            proxy_ssl_server_name on;
            rewrite ^/binance-api/(.*)$ /$1 break;
            rewrite ^/binance-api$ / break;
        }
    }
}
