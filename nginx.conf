events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 4201;
        server_name localhost;

        root /var/www/html;
        index index.html;

        # Angular routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Python FastAPI proxy — handles all API calls:
        #   /python-ai/argocd/*     → ArgoCD proxy
        #   /python-ai/jira/*       → Jira proxy  (replaces old /jira-api)
        #   /python-ai/bitbucket/*  → Bitbucket proxy  (replaces old /bitbucket-api)
        #   /python-ai/predict etc. → Crypto AI
        location /python-ai {
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rewrite path to strip /python-ai prefix
            rewrite ^/python-ai/(.*)$ /$1 break;
            rewrite ^/python-ai$ / break;
        }

        # Binance Proxy (browser-safe public API, no auth headers needed)
        location /binance-api {
            proxy_pass https://api.binance.com;
            proxy_set_header Host api.binance.com;
            proxy_ssl_server_name on;
            rewrite ^/binance-api/(.*)$ /$1 break;
            rewrite ^/binance-api$ / break;
        }
    }
}
